<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Matemática</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Cálculo de Matemática</h1>
        <p>Informe dois valores. A soma será calculada ao sair de um dos campos.</p>

        <div class="campo">
            <label for="valor1">Valor 1</label>
            <input type="number" id="valor1" value="0">
        </div>

        <div class="campo">
            <label for="valor2">Valor 2</label>
            <input type="number" id="valor2" value="0">
        </div>

        <div class="campo">
            <label for="resultado">Resultado da soma</label>
            <input type="number" id="resultado" value="0" readonly>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
